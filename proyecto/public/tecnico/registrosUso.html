<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros de uso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="d-flex flex-column min-vh-100 sgrsi-app" id="inicio" data-rol="tecnico" data-seccion="registrosUso">
    <header class="navbar navbar-expand-md navbar-dark sgrsi-navbar sticky-top">
        <section class="container-fluid">
            <a class="navbar-brand fw-bold" href="inicio.html"><img src="../assets/img/logoITI.png" alt="Logo ITI" class="sgrsi-navbar-logo">SGRSI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
            <nav class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="solicitudes.html">Solicitudes</a></li>
                    <li class="nav-item"><a class="nav-link" href="incidencias.html">Incidencias</a></li>
                    <li class="nav-item"><a class="nav-link" href="metricas.html">Métricas</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="prestamos.html">Préstamos</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="registrosUso.html">Registros de uso</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-cerrar-sesion>Cerrar sesión</a></li>
                </ul>
            </nav>
        </section>
    </header>
    <main class="container-xl flex-grow-1 p-3 p-md-4">
        <div id="mensajePagina" class="alert" role="alert" hidden></div>
        <section class="bg-white rounded p-3 p-md-4 panelTabla">
            <h1 class="h3 mb-3">Registros de uso de laboratorios</h1>
                <form class="sgrsi-herramientas-tabla" data-tabla="tablaRegistros1" aria-label="Buscar y ordenar registros">
                <div class="sgrsi-busqueda-tabla">
                    <label><span>Buscar</span><input type="search" name="busqueda" class="form-control form-control-sm" placeholder="Ej.: cédula, equipo o estado"></label>
                    <label><span>Buscar en</span><select name="columna" class="form-select form-select-sm"><option value="">Todas las columnas</option><option value="0">Solicitante</option><option value="1">Laboratorio</option><option value="2">Turno</option><option value="3">Fecha y hora</option><option value="4">Docente</option><option value="5">Grupo</option><option value="6">Asignatura</option><option value="7">Máquinas</option><option value="8">Incidencias</option></select></label>
                    <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
                </div>
                <label><span>Ordenar por</span><select name="orden" class="form-select form-select-sm"><option value="">Orden original</option><option value="0">Solicitante</option><option value="1">Laboratorio</option><option value="2">Turno</option><option value="3">Fecha y hora</option><option value="4">Docente</option><option value="5">Grupo</option><option value="6">Asignatura</option><option value="7">Máquinas</option><option value="8">Incidencias</option></select></label>
                <label><span>Sentido</span><select name="direccion" class="form-select form-select-sm"><option value="asc">Ascendente</option><option value="desc">Descendente</option></select></label>
                <button type="button" name="ordenar" class="btn btn-primary btn-sm">Ordenar</button>
                <button type="button" name="limpiar" class="btn btn-secondary btn-sm">Limpiar</button>
            </form>
            <p class="sgrsi-resultado-tabla" data-resultado="tablaRegistros1" role="status" aria-live="polite"></p>
            <section class="table-responsive"><table id="tablaRegistros1" class="table table-bordered table-hover table-sm mb-0">
                    <thead class="table-light"><tr><th>Solicitante</th><th>Laboratorio</th><th>Turno</th><th>Fecha y hora</th><th>Docente</th><th>Grupo</th><th>Asignatura</th><th>Máquinas</th><th>Incidencias</th></tr></thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </section>
        </section>
    </main>
    <footer class="sgrsi-footer text-light mt-auto py-3 py-md-4"><p class="text-center mb-0">© 2026 SGRSI</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/tablas.js"></script>
    <script src="../assets/js/formulario.js"></script>
    <script src="../assets/js/sesion.js"></script>

    <script src="../assets/js/tecnico/registrosUso.js"></script>
</body>
</html>
