<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/formularios.css">
    <link rel="stylesheet" href="../assets/css/dialogos.css">
</head>

<body class="d-flex flex-column min-vh-100 sgrsi-app" id="inicio" data-rol="administrador" data-seccion="usuarios">

    <header class="navbar navbar-expand-md navbar-dark sgrsi-navbar sticky-top">
        <section class="container-fluid">
            <a class="navbar-brand fw-bold" href="inicio.html"><img src="../assets/img/logoITI.png" alt="Logo ITI" class="sgrsi-navbar-logo">SGRSI</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <nav class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="usuarios.html">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="incidencias.html">Incidencias</a></li>
                    <li class="nav-item"><a class="nav-link" href="metricas.html">Métricas</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-cerrar-sesion>Cerrar sesión</a></li>
                </ul>
            </nav>
        </section>
    </header>

    <main class="flex-grow-1 p-2 p-md-3 p-lg-4">
        <div id="mensajePagina" class="alert" role="alert" hidden></div>





        <section class="bg-white rounded mb-4 p-3 p-md-4 seccionTablaEmpleados">
            <section class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
                <h2 class="h4 m-0">Datos de usuarios</h2>
                <button type="button" class="btn btn-success" id="btnAltaUsuario">
                    Alta usuario
                </button>
            </section>

            <form class="sgrsi-herramientas-tabla" data-tabla="tablaRegistros1" aria-label="Buscar y ordenar registros">
                <div class="sgrsi-busqueda-tabla">
                    <label><span>Buscar</span><input type="search" name="busqueda" class="form-control form-control-sm" placeholder="Ej.: cédula, equipo o estado"></label>
                    <label><span>Buscar en</span><select name="columna" class="form-select form-select-sm"><option value="">Todas las columnas</option><option value="0">Cédula</option><option value="1">Nombre</option><option value="2">Apellido</option><option value="3">Cargo</option><option value="4">Estado</option></select></label>
                    <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
                </div>
                <label><span>Ordenar por</span><select name="orden" class="form-select form-select-sm"><option value="">Orden original</option><option value="0">Cédula</option><option value="1">Nombre</option><option value="2">Apellido</option><option value="3">Cargo</option><option value="4">Estado</option></select></label>
                <label><span>Sentido</span><select name="direccion" class="form-select form-select-sm"><option value="asc">Ascendente</option><option value="desc">Descendente</option></select></label>
                <button type="button" name="ordenar" class="btn btn-primary btn-sm">Ordenar</button>
                <button type="button" name="limpiar" class="btn btn-secondary btn-sm">Limpiar</button>
            </form>
            <p class="sgrsi-resultado-tabla" data-resultado="tablaRegistros1" role="status" aria-live="polite"></p>
            <section class="table-responsive panelTabla">
                <table id="tablaRegistros1" class="table table-bordered table-hover table-sm mb-0 small">
                    <caption class="d-md-table-caption">Listado de usuarios registrados</caption>
                    <thead class="table-light">
                        <tr>
                            <th >Cédula</th>
                            <th>Nombre</th>
                            <th >Apellido</th>
                            <th >Cargo</th>
                            <th >Estado</th>
                            <th >Operaciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </section>
        </section>

        <dialog class="dialogAltaUsuario seccionFormulario w-100 p-0 rounded-3 border-0 dialogGestion600">
            <button class="btn-close position-absolute top-0 end-0 m-2" id="btnCerrarAltaUsuario" type="button"
                aria-label="Cerrar"></button>

            <form method="post" id="formularioAltaUsuario" class="p-4">
                <input type="hidden" name="csrfToken" value="">
                <fieldset>
                    <legend class="h4 mb-4" id="tituloFormularioUsuario">Gestión de usuarios</legend>

                    <fieldset class="mb-3">
                        <legend class="h6 mb-3">Datos del usuario</legend>

                        <section class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="cedula" class="form-label">Cédula</label>
                                <input type="text" id="cedula" name="cedula" class="form-control"
                                    placeholder="Ingrese la cédula" autocomplete="off" pattern="[1-9][0-9]{7}"
                                    inputmode="numeric" maxlength="8" required>
                            </div>

                            <div class="col-12 col-md-6 cajaEntradaDeDatos">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control"
                                    placeholder="Ingrese el nombre" autocomplete="given-name" required maxlength="50">
                            </div>

                            <div class="col-12 col-md-6 cajaEntradaDeDatos">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" id="apellido" name="apellido" class="form-control"
                                    placeholder="Ingrese el apellido" autocomplete="family-name" required maxlength="50">
                            </div>

                            <div class="col-12 col-md-6 cajaEntradaDeDatos">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" id="contrasena" name="contrasena" class="form-control"
                                    placeholder="Ingrese la clave" autocomplete="new-password" required>
                            </div>


                             <div class="col-12 col-md-6 cajaEntradaDeDatos">
                                <label for="confirmarContrasena" class="form-label">Confirmar Contraseña</label>
                                <input type="password" id="confirmarContrasena" name="confirmarContrasena" class="form-control"
                                    placeholder="Confirme la clave" autocomplete="new-password" required>
                            </div>

                            <div class="col-12 col-md-6 cajaEntradaDeDatos">
                                <label for="rol" class="form-label">Rol</label>
                                <select name="rol" id="rol" class="form-select" required>
                                    <option value="" disabled selected>Seleccione un cargo</option>
                                    <option value="solicitante">Solicitante</option>
                                    <option value="tecnico">Técnico</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                            </div>
                        </section>
                    </fieldset>

                    <button type="submit" class="btn btn-primary w-100" id="botonGuardarUsuario">Guardar usuario</button>
                </fieldset>
            </form>
        </dialog>

        <template id="operacionesUsuario">
            <td><div class="cajaOperaciones">
                <button type="button" class="btnOperacion btnModificarUsuario" data-modificar>Modificar</button>
                <button type="button" class="btnOperacion btnDesactivar" data-desactivar>Desactivar</button>
                <button type="button" class="btnOperacion btnActivar" data-activar>Activar</button>
            </div></td>
        </template>
    </main>

    <footer class="sgrsi-footer text-light mt-auto py-3 py-md-4">
        <address class="d-flex flex-column flex-md-row justify-content-center gap-2 gap-md-3 text-center mb-2">
            <a href="http://instagram.com" class="text-light text-decoration-none">@SGRSI</a>
            <a href="tel:+29043586" class="text-light text-decoration-none">+29043586</a>
            <a href="mailto:asistentesiti@gmail.com" class="text-light text-decoration-none">asistentesiti@gmail.com</a>
        </address>
        <p class="text-center mb-0">© 2026 SGRSI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/tablas.js"></script>
    <script src="../assets/js/formulario.js"></script>
    <script src="../assets/js/sesion.js"></script>


    <script src="../assets/js/admin/usuarios.js"></script>
    <script src="../assets/js/validacionCampos.js"></script>
</body>

</html>
