<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dialogos.css">
</head>
<body class="d-flex flex-column min-vh-100 sgrsi-app" data-rol="tecnico" data-seccion="solicitudes">
    <header class="navbar navbar-expand-md navbar-dark sgrsi-navbar sticky-top">
        <section class="container-fluid">
            <a class="navbar-brand fw-bold" href="inicio.html">SGRSI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="solicitudes.html">Solicitudes</a></li>
                    <li class="nav-item"><a class="nav-link" href="incidencias.html">Incidencias</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="prestamos.html">Préstamos</a></li>
                    <li class="nav-item"><a class="nav-link" href="registrosUso.html">Registros de uso</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-cerrar-sesion>Cerrar sesión</a></li>
                </ul>
            </nav>
        </section>
    </header>
    <main class="container-xl flex-grow-1 p-3 p-md-4">
        <div id="mensajePagina" class="alert" role="alert" hidden></div>


        <section class="bg-white rounded p-3 p-md-4 panelTabla">
            <h1 class="h3 mb-3">Solicitudes de servicio</h1>
            <section class="table-responsive">
                <table class="table table-bordered table-hover table-sm mb-0 small">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Solicitante</th><th>Apertura</th><th>Fecha esperada</th><th>Cierre</th><th>Turno</th><th>Docente</th><th>Grupo</th><th>Asignatura</th><th>Laboratorio</th><th>Dispositivo</th><th>Tipo</th><th>Descripción</th><th>Estado</th><th>Gestión</th></tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </section>
        </section>
    </main>
    <dialog id="dialogGestionSolicitud" class="seccionFormulario w-100 p-0 rounded-3 border-0 dialogGestion500">
        <button class="btn-close position-absolute top-0 end-0 m-2" id="btnCerrarGestionSolicitud" type="button" aria-label="Cerrar"></button>
        <form method="post" id="formularioGestionSolicitud" class="p-4">
            <input type="hidden" name="csrfToken" value="">
            <input type="hidden" name="idSolicitud" id="idSolicitudGestion">
            <fieldset>
                <legend class="h4 mb-4">Gestionar solicitud</legend>
                <label for="estadoSolicitud" class="form-label">Estado</label>
                <select name="estado" id="estadoSolicitud" class="form-select" required>

                </select>
                <button class="btn btn-primary w-100 mt-4">Guardar cambios</button>
            </fieldset>
        </form>
    </dialog>
    <footer class="sgrsi-footer text-light mt-auto py-3"><p class="text-center mb-0">© 2026 SGRSI</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/navegacion.js"></script>
    <script src="../assets/js/formulario.js"></script>


    <script src="../assets/js/tecnico/solicitudes.js"></script>
    <script src="../assets/js/validacionCampos.js"></script>
</body>
</html>
